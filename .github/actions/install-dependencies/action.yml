name: "Install dependencies for deskflow"
description: "Install the dependencies needed to build deskflow"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false

  qt-version:
    description: "The version of Qt to install (Windows & macOS)"
    required: false

  vcpkg-triplet:
    description: "vcpkg triplet to use (Windows)"
    required: false

outputs:
  vcpkg-cmake-config:
    description: "windows vcpkg output for cmaket"
    value: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

runs:
  using: "composite"

  steps:
    - name: Install Depends
      if: ${{ runner.os != 'Windows' }}
      run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            # dylibbundler: bundle the runtime-loaded GStreamer plugin dylibs (and their
            # deps) into the .app at package time. pkg-config: locate the GStreamer framework
            # at configure time (CMake's FindPkgConfig) — previously pulled in transitively by
            # the brew gstreamer formula, so install it explicitly now that gstreamer is gone.
            # GStreamer itself is NOT from Homebrew — it comes from its official Universal
            # framework .pkg installed below.
            brew install googletest openssl doxygen dylibbundler pkg-config --quiet
            # Audio routing: install the official Universal GStreamer.framework (runtime +
            # devel) from gstreamer.freedesktop.org — the documented macOS distribution
            # method. One Universal package covers x86_64 + arm64 and installs to
            # /Library/Frameworks/GStreamer.framework; faster/more deterministic than
            # building the heavy brew gstreamer formula (which pulled ffmpeg/x264/etc.).
            GST_VER=1.28.3
            GST_BASE="https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VER}"
            for pkg in "gstreamer-1.0-${GST_VER}-universal.pkg" "gstreamer-1.0-devel-${GST_VER}-universal.pkg"; do
              curl -fSL --retry 3 -o "/tmp/${pkg}" "${GST_BASE}/${pkg}"
              sudo installer -pkg "/tmp/${pkg}" -target /
            done
            # Hard gate: fail loudly if the dev files (.pc) did not land, so a broken
            # GStreamer install can never silently disable audio (mirrors the Windows SDK gate).
            test -f /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig/gstreamer-1.0.pc \
              || { echo "::error::GStreamer.framework devel (.pc) missing after install"; exit 1; }
          elif [ "$RUNNER_OS" == "Linux" ]; then
            if [ ${{inputs.like}} == "debian" ]; then
              apt update -qqq > /dev/null
              apt install -qqq cmake build-essential ninja-build \
                xorg-dev libx11-dev libxtst-dev libssl-dev \
                libglib2.0-dev libxkbfile-dev qt6-base-dev qt6-tools-dev \
                libgtk-3-dev libgtest-dev libgmock-dev \
                libei-dev libportal-dev libpulse-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
                help2man doxygen -y >/dev/null
            elif [ ${{inputs.like}} == "fedora" ]; then
              dnf install -y cmake make ninja-build gcc-c++ rpm-build openssl-devel \
                glib2-devel libXtst-devel libxkbfile-devel qt6-qtbase-devel qt6-qttools-devel \
                gtk3-devel gtest-devel gmock-devel libei-devel libportal-devel \
                gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good \
                help2man doxygen
            elif [ ${{inputs.like}} == "suse" ]; then
              zypper refresh
              # openSUSE Tumbleweed mirrors are frequently flaky (403/404/timeouts during
              # mirror sync). The GStreamer dependency tree pulls in many optional codec
              # packages, which amplified the exposure and started failing the download.
              # --no-recommends keeps the install small (we don't need those codecs), and we
              # retry to ride out transient mirror failures (zypper reuses the package cache).
              n=0
              until zypper install -y --no-recommends --force-resolution \
                cmake make ninja gcc-c++ rpm-build libopenssl-devel \
                glib2-devel libXtst-devel libxkbfile-devel qt6-base-devel qt6-tools-devel \
                qt6-linguist-devel gtk3-devel doxygen \
                googletest-devel googlemock-devel libei-devel libportal-devel help2man \
                gstreamer-devel gstreamer-plugins-base-devel gstreamer-plugins-good; do
                n=$((n + 1))
                if [ "$n" -ge 4 ]; then echo "zypper install failed after $n attempts"; exit 1; fi
                echo "zypper install hit a mirror hiccup, retry $n..."; sleep 20
              done
            elif [ ${{ inputs.like }} == "arch" ]; then
              pacman -Syu --noconfirm base-devel cmake ninja \
                gcc openssl glib2 libxtst libxkbfile gtest libei libportal \
                qt6-base qt6-tools qt6-svg qt6-translations qt6-declarative gtk3 help2man doxygen graphviz rsync \
                gstreamer gst-plugins-base gst-plugins-good
            else
              echo "Unknown like"
            fi
          else
            echo "Unknown OS: $RUNNER_OS"
          fi
      shell: bash

    - name: Install Qt
      if: ${{runner.os != 'Linux' }}
      uses: jurplel/install-qt-action@v4
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
      with:
        version: ${{inputs.qt-version}}
        cache: true
        cache-key-prefix: ${{matrix.target.os}}-${{inputs.qt-version}}

    # GStreamer (audio routing) comes from the official prebuilt MSVC SDK for BOTH Windows
    # arches. From 1.28 the SDK is a single per-arch installer that ships runtime AND devel
    # (.pc files, headers, import libs) and, importantly, an arm64 build — earlier releases
    # had no arm64 and split runtime/devel into two MSIs whose back-to-back silent install
    # was unreliable (a failed devel MSI left no lib\pkgconfig, so pkg-config found nothing
    # and audio was silently disabled on a green build). A from-source vcpkg build blows the
    # job budget, so GStreamer is never a vcpkg dependency on Windows.
    - name: Install GStreamer SDK (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $ver = "1.28.3"
        if ("${{ inputs.vcpkg-triplet }}" -like "*arm64*") { $arch = "arm64"; $ARCH = "ARM64" } else { $arch = "x86_64"; $ARCH = "X86_64" }
        $exe = "gstreamer-1.0-msvc-$arch-$ver.exe"
        $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$exe"
        $dl  = "$env:TEMP\$exe"
        curl.exe -sL --fail --retry 3 -o $dl $url
        if ($LASTEXITCODE -ne 0) { throw "GStreamer SDK download failed (curl exit $LASTEXITCODE)" }
        # /S installs silently. The installer runs elevated on the runner and lands in
        # C:\Program Files\gstreamer\1.0\msvc_<arch>, recording that root in a machine env var.
        $p = Start-Process -FilePath $dl -ArgumentList "/S" -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "GStreamer SDK installer exited $($p.ExitCode)" }
        $root = [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_$ARCH", "Machine")
        if (-not $root) { $root = "C:\Program Files\gstreamer\1.0\msvc_$arch" }
        $root = $root.TrimEnd("\")
        # Hard gate: the devel .pc must exist, else pkg-config can't find GStreamer and audio
        # would disable silently. Fail the job loudly instead — this is the check whose absence
        # let the broken build ship without audio. (The SDK's .pc files are relocatable via
        # ${pcfiledir}, so the Program Files path — spaces and all — resolves fine.)
        $pc = "$root\lib\pkgconfig\gstreamer-1.0.pc"
        if (-not (Test-Path $pc)) { throw "GStreamer SDK incomplete: $pc not found" }
        "GSTREAMER_1_0_ROOT_MSVC_$ARCH=$root\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        Write-Output "GStreamer SDK $ver ($arch) ready at $root"

    - name: Build and cache vcpkg
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg
      uses: johnwason/vcpkg-action@v8
      with:
        # Both Windows arches get GStreamer from the official SDK (installed above); it is
        # never built via vcpkg. pkgconf gives FindPkgConfig a usable pkg-config tool.
        pkgs: gtest openssl pkgconf
        extra-args: --classic --host-triplet=${{inputs.vcpkg-triplet}}
        triplet: ${{inputs.vcpkg-triplet}}
        token: ${{ github.token }}
        revision: master

    - name: Cache Chocolatey
      id: cache-choco
      if: (runner.os == 'Windows')
      uses: actions/cache@v5
      with:
        path: |
            C:/ProgramData/chocolatey/bin/
            C:/ProgramData/chocolatey/lib/doxygen.install
            C:/Program*/doxygen/
        key: cache-chocolatey${{ matrix.config.arch }}-doxygen

    - name: Install doxygen (windows)
      if: ((runner.os == 'Windows') && (steps.cache-choco.outputs.cache-hit != 'true'))
      shell: bash
      run: choco install doxygen.install

    - name: Install Wix
      if: ${{ runner.os == 'Windows' }}
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2
        wix extension add --global WixToolset.Util.wixext/5.0.2
        wix extension add --global WixToolset.Firewall.wixext/5.0.2
      shell: pwsh


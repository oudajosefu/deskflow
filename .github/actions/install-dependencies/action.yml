name: "Install dependencies for deskflow"
description: "Install the dependencies needed to build deskflow"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false

  qt-version:
    description: "The version of Qt to install (Windows & macOS)"
    required: false

  vcpkg-triplet:
    description: "vcpkg triplet to use (Windows)"
    required: false

outputs:
  vcpkg-cmake-config:
    description: "windows vcpkg output for cmaket"
    value: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

runs:
  using: "composite"

  steps:
    - name: Install Depends
      if: ${{ runner.os != 'Windows' }}
      run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            # gstreamer: audio routing runtime/codec/RTP; dylibbundler: bundle the
            # runtime-loaded plugin dylibs (and their deps) into the .app at package time.
            brew install googletest openssl doxygen gstreamer dylibbundler --quiet
          elif [ "$RUNNER_OS" == "Linux" ]; then
            if [ ${{inputs.like}} == "debian" ]; then
              apt update -qqq > /dev/null
              apt install -qqq cmake build-essential ninja-build \
                xorg-dev libx11-dev libxtst-dev libssl-dev \
                libglib2.0-dev libxkbfile-dev qt6-base-dev qt6-tools-dev \
                libgtk-3-dev libgtest-dev libgmock-dev \
                libei-dev libportal-dev libpulse-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
                help2man doxygen -y >/dev/null
            elif [ ${{inputs.like}} == "fedora" ]; then
              dnf install -y cmake make ninja-build gcc-c++ rpm-build openssl-devel \
                glib2-devel libXtst-devel libxkbfile-devel qt6-qtbase-devel qt6-qttools-devel \
                gtk3-devel gtest-devel gmock-devel libei-devel libportal-devel \
                gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good \
                help2man doxygen
            elif [ ${{inputs.like}} == "suse" ]; then
              zypper refresh
              # openSUSE Tumbleweed mirrors are frequently flaky (403/404/timeouts during
              # mirror sync). The GStreamer dependency tree pulls in many optional codec
              # packages, which amplified the exposure and started failing the download.
              # --no-recommends keeps the install small (we don't need those codecs), and we
              # retry to ride out transient mirror failures (zypper reuses the package cache).
              n=0
              until zypper install -y --no-recommends --force-resolution \
                cmake make ninja gcc-c++ rpm-build libopenssl-devel \
                glib2-devel libXtst-devel libxkbfile-devel qt6-base-devel qt6-tools-devel \
                qt6-linguist-devel gtk3-devel doxygen \
                googletest-devel googlemock-devel libei-devel libportal-devel help2man \
                gstreamer-devel gstreamer-plugins-base-devel gstreamer-plugins-good; do
                n=$((n + 1))
                if [ "$n" -ge 4 ]; then echo "zypper install failed after $n attempts"; exit 1; fi
                echo "zypper install hit a mirror hiccup, retry $n..."; sleep 20
              done
            elif [ ${{ inputs.like }} == "arch" ]; then
              pacman -Syu --noconfirm base-devel cmake ninja \
                gcc openssl glib2 libxtst libxkbfile gtest libei libportal \
                qt6-base qt6-tools qt6-svg qt6-translations qt6-declarative gtk3 help2man doxygen graphviz rsync \
                gstreamer gst-plugins-base gst-plugins-good
            else
              echo "Unknown like"
            fi
          else
            echo "Unknown OS: $RUNNER_OS"
          fi
      shell: bash

    - name: Install Qt
      if: ${{runner.os != 'Linux' }}
      uses: jurplel/install-qt-action@v4
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
      with:
        version: ${{inputs.qt-version}}
        cache: true
        cache-key-prefix: ${{matrix.target.os}}-${{inputs.qt-version}}

    # Windows x64 gets GStreamer from the official prebuilt MSVC SDK (a from-source
    # vcpkg build blows the job time budget). arm64 has no official SDK, so it builds
    # via vcpkg below. The devel package ships the .pc files, headers and import libs.
    - name: Install GStreamer SDK (Windows x64)
      if: ${{ runner.os == 'Windows' && !contains(inputs.vcpkg-triplet, 'arm64') }}
      shell: pwsh
      run: |
        $ver = "1.24.13"
        $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
        foreach ($pkg in @("gstreamer-1.0-msvc-x86_64-$ver.msi", "gstreamer-1.0-devel-msvc-x86_64-$ver.msi")) {
          Invoke-WebRequest -Uri "$base/$pkg" -OutFile "$env:TEMP\$pkg"
          # ADDLOCAL=ALL installs the complete plugin set (the default install omits most).
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$env:TEMP\$pkg`" /qn /norestart ADDLOCAL=ALL"
        }
        $root = "C:\gstreamer\1.0\msvc_x86_64"
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Build and cache vcpkg
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg
      uses: johnwason/vcpkg-action@v8
      with:
        # x64 gets GStreamer from the official SDK; arm64 builds without audio. Neither
        # builds GStreamer via vcpkg. pkgconf gives FindPkgConfig a usable pkg-config tool.
        pkgs: gtest openssl pkgconf
        extra-args: --classic --host-triplet=${{inputs.vcpkg-triplet}}
        triplet: ${{inputs.vcpkg-triplet}}
        token: ${{ github.token }}
        revision: master

    - name: Cache Chocolatey
      id: cache-choco
      if: (runner.os == 'Windows')
      uses: actions/cache@v5
      with:
        path: |
            C:/ProgramData/chocolatey/bin/
            C:/ProgramData/chocolatey/lib/doxygen.install
            C:/Program*/doxygen/
        key: cache-chocolatey${{ matrix.config.arch }}-doxygen

    - name: Install doxygen (windows)
      if: ((runner.os == 'Windows') && (steps.cache-choco.outputs.cache-hit != 'true'))
      shell: bash
      run: choco install doxygen.install

    - name: Install Wix
      if: ${{ runner.os == 'Windows' }}
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2
        wix extension add --global WixToolset.Util.wixext/5.0.2
        wix extension add --global WixToolset.Firewall.wixext/5.0.2
      shell: pwsh

